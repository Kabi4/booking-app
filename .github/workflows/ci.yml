name: Booking System CI

on:
  push:
    branches:
      - prod

  pull_request:
    branches:
      - prod

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript build
        run: npm run build

      - name: Build Docker image
        run: docker build -t booking-system .